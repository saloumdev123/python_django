<h2>{{ article.titre }}</h2>
<p>{{ article.contenu }}</p>
<p>Publié le : {{ article.date_publication }}</p>
{% if article.image %}
    <img src="{{ article.image.url }}" alt="Image de l'article">
{% endif %}
<a href="{% url 'article_update' article.pk %}">Modifier</a>
<a href="{% url 'article_delete' article.pk %}">Supprimer</a>
